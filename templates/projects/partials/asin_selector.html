{% load rv %}
{% comment %}ASIN switcher that preserves the current tab and query parameters.{% endcomment %}
<div class="rv-dropdown">
  <button type="button" class="rv-btn" data-rv-dropdown aria-haspopup="listbox" aria-expanded="false">
    <svg aria-hidden="true"><use href="#rv-i-box"></use></svg>
    <span class="rv-mono">{{ selected_asin|default:"No ASIN" }}</span>
    <svg aria-hidden="true"><use href="#rv-i-chevron-down"></use></svg>
  </button>
  <div class="rv-dropdown__menu" style="left:0;right:auto;min-width:300px" role="listbox">
    {% for option in asin_options %}
      <a class="rv-dropdown__item {% if option.asin == selected_asin %}is-active{% endif %}"
         href="{% qs asin=option.asin page=1 %}"
         hx-get="{% qs asin=option.asin page=1 %}" hx-target="#rv-tab-panel" hx-swap="innerHTML" hx-push-url="true" data-rv-skeleton="panel" role="option"
         {% if option.asin == selected_asin %}aria-selected="true"{% endif %}>
        <span class="rv-mono">{{ option.asin }}</span>
        <span class="rv-truncate" style="max-width:150px;color:var(--rv-text-muted);font-size:12px">{{ option.title }}</span>
        {% if option.is_primary %}<span class="rv-badge rv-badge--accent" style="margin-left:auto">Primary</span>{% endif %}
      </a>
    {% empty %}
      <div style="padding:10px;color:var(--rv-text-subtle);font-size:12.5px">No ASINs in this project yet.</div>
    {% endfor %}
  </div>
</div>
