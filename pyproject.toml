[project]
name = "itrend-rankvista"
version = "1.0.0"
description = "iTrend RankVista - Amazon Search, ASIN & Keyword Intelligence Platform"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { text = "Proprietary" }
authors = [{ name = "iTrend Solutions" }]

dependencies = [
    "django>=5.1,<5.3",
    "pymongo>=4.9",
    "redis>=5.1",
    "python-dotenv>=1.0",
    "django-htmx>=1.19",
    "whitenoise>=6.7",
    "gunicorn>=23.0; sys_platform != 'win32'",
    "waitress>=3.0; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-django>=4.9",
    "pytest-cov>=5.0",
    "ruff>=0.7",
]

[tool.uv]
default-groups = []

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-django>=4.9",
    "pytest-cov>=5.0",
    "ruff>=0.7",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["test_*.py", "tests.py"]
testpaths = ["apps", "tests"]
addopts = "-q --strict-markers"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [".venv", "migrations", "staticfiles"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "DJ"]
ignore = ["E501", "B008"]

[tool.ruff.lint.isort]
known-first-party = ["apps", "config"]
